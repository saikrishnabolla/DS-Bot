services:
  cue:
    image: cue:local
    pull_policy: never
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "${CUE_PORT:-3080}:3080"
    env_file:
      - path: .env
        required: false
    environment:
      CUE_PORT: "3080"
      CUE_PUBLIC_ORIGIN: "${CUE_PUBLIC_ORIGIN:-http://localhost:3080}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
    volumes:
      - ./docker/data:/data
      - ./docker/workspace:/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    stop_grace_period: 15s
